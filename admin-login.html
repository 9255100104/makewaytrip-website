
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Makeway Trip</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #172033;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.09);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #667085; line-height: 1.5; }
    label {
      display: block;
      margin: 22px 0 8px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 24px; color: #b42318; }
    a { color: #174ea6; text-decoration: none; }
    .back { display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="login-card">
    <p><strong>MAKEWAY TRIP</strong> · ADMIN</p>
    <h1>Admin Login</h1>
    <p>Enter your administrator password to continue.</p>

    <form id="loginForm">
      <label for="password">Admin Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        maxlength="1024"
        placeholder="Enter your password"
      >
      <button id="loginButton" type="submit">Login</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>

    <a class="back" href="/">← Back to website</a>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    async function checkSession() {
      try {
        const response = await fetch("/api/admin/session", {
          credentials: "same-origin",
          cache: "no-store"
        });
        const data = await response.json();

        if (data.authenticated) {
          window.location.replace("/admin.html");
        }
      } catch {
        // Login form remains available.
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const password = document.getElementById("password").value;

        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.textContent = data.error || "Login failed.";
          return;
        }

        window.location.replace("/admin.html");
      } catch {
        message.textContent = "Connection error. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });

    checkSession();
  </script>
</body>
</html>
